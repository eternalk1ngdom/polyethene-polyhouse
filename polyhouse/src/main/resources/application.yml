server:
  port: 8080

spring:
  application:
    name: polyhouse
  # 开启 JDK 21 虚拟线程协程 (为未来高并发与 Spring AI 预留)
  threads:
    virtual:
      enabled: true
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/polyhouse_db?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}
      timeout: 5000ms

# MyBatis-Plus 企业级配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: assign_id # 默认使用雪花算法生成 bigint 主键
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# 聚妙屋自定义安全配置
polyhouse:
  jwt:
    secret: ${POLYHOUSE_JWT_SECRET:}
    expiration-days: 7
