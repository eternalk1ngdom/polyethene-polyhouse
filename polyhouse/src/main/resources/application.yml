server:
  port: ${PORT:8080}

spring:
  servlet:
    multipart:
      enabled: false
  application:
    name: polyhouse
  # 开启 JDK 21 虚拟线程协程 (为未来高并发与 Spring AI 预留)
  threads:
    virtual:
      enabled: true
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/polyhouse_db?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  data:
    redis:
      # Windows 通过 WSL 的本机端口转发访问 Redis，固定 IPv4 避免 localhost 解析差异。
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}
      # 当前本地实例无认证；以后启用 ACL 或密码时，只从运行环境注入凭据。
      username: ${REDIS_USERNAME:}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL:false}
      client-type: lettuce
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:3s}
      timeout: ${REDIS_TIMEOUT:5s}

# MyBatis-Plus 企业级配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    # 禁止输出 SQL 及绑定参数，避免后续用户查询把凭据和个人信息写入日志。
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  global-config:
    db-config:
      id-type: assign_id # 默认使用雪花算法生成 bigint 主键
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# 聚妙屋自定义安全配置
polyhouse:
  # 通用配置关闭星潮。本机默认值见 application-default.yml，密钥仍由运行环境注入。
  trend:
    enabled: ${POLYHOUSE_TREND_ENABLED:false}
    github-token: ${POLYHOUSE_GITHUB_TOKEN:}
    # 手动任务依赖增量表，开关独立于后面的每日调度。
    jobs:
      enabled: ${POLYHOUSE_TREND_JOBS_ENABLED:false}
    # 自动受理独立关闭；时间固定按Asia/Shanghai解释，休眠时不补造历史日报。
    schedule:
      enabled: ${POLYHOUSE_TREND_SCHEDULE_ENABLED:false}
      daily-time: ${POLYHOUSE_TREND_DAILY_TIME:06:30}
      retry-delay-minutes: 45
    # 每日自动日报发布成功后顺路自动生成 7 日风口简报（独立开关，默认关闭；复用同指纹防重与 10 元共享月预算）。
    briefing:
      auto-enabled: ${POLYHOUSE_TREND_BRIEFING_AUTO_ENABLED:false}
    # 单条公开内容缓存；数据库指针仍是权威，不用于防重或存放私有材料。
    cache:
      enabled: ${POLYHOUSE_TREND_CACHE_ENABLED:false}
    # Key 只注入后端进程；月额度使用人民币微元，最高仍为已批准的十元。
    ai:
      enabled: ${POLYHOUSE_TREND_AI_ENABLED:false}
      api-key: ${POLYHOUSE_DEEPSEEK_API_KEY:}
      model: deepseek-flash
      input-yuan-per-million: 2
      output-yuan-per-million: 8
      monthly-budget-micros: 10000000
      # 轻度思考默认关闭；仅允许 low 档，开启后输出上限 3000 token、超时 60s。
      thinking-enabled: ${POLYHOUSE_TREND_AI_THINKING_ENABLED:false}
      thinking-effort: ${POLYHOUSE_TREND_AI_THINKING_EFFORT:low}
  jwt:
    # 标准 Base64 编码的 32 字节安全随机密钥；空值不影响未接入鉴权的模块，实际签发/验证前必须配置。
    secret: ${POLYHOUSE_JWT_SECRET:}
    # JWT 的唯一有效期来源；Redis 白名单后续按 Token 的 expiresAt 计算剩余 TTL。
    expiration-days: 7
