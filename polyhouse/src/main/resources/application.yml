server:
  port: 8080

spring:
  application:
    name: polyhouse
  # 开启 JDK 21 虚拟线程协程 (为未来高并发与 Spring AI 预留)
  threads:
    virtual:
      enabled: true
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/polyhouse_db?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  data:
    redis:
      # Windows 通过 WSL 的本机端口转发访问 Redis，固定 IPv4 避免 localhost 解析差异。
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}
      # 当前本地实例无认证；以后启用 ACL 或密码时，只从运行环境注入凭据。
      username: ${REDIS_USERNAME:}
      password: ${REDIS_PASSWORD:}
      client-type: lettuce
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:3s}
      timeout: ${REDIS_TIMEOUT:5s}

# MyBatis-Plus 企业级配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    # 禁止输出 SQL 及绑定参数，避免后续用户查询把凭据和个人信息写入日志。
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  global-config:
    db-config:
      id-type: assign_id # 默认使用雪花算法生成 bigint 主键
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# 聚妙屋自定义安全配置
polyhouse:
  jwt:
    # 标准 Base64 编码的 32 字节安全随机密钥；空值不影响未接入鉴权的模块，实际签发/验证前必须配置。
    secret: ${POLYHOUSE_JWT_SECRET:}
    # JWT 的唯一有效期来源；Redis 白名单后续按 Token 的 expiresAt 计算剩余 TTL。
    expiration-days: 7
